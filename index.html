<html><head>
  <title> ChickenSearch</title>
   <link rel="stylesheet" href="/styles.css">
</head>
<body>
<h1>ℂ𝕙𝕚𝕔𝕜𝕖𝕟𝕊𝕖𝕒𝕣𝕔𝕙</h1>
  <p id="typewritereffect"></p>
  <img src="https://chicken-search.vercel.app/logo.jpg" alt="Logo" style="height: 50px; width: 50px;">
<script async src="https://cse.google.com/cse.js?cx=b72f194a5e01a4864">
</script>
<div class="gcse-searchbox"></div>

<div class="gcse-searchresults"></div>

  <script>
    const text = "Browse the Web Safely and in Style with ChickenSearch";
    const speed = 100; 
    let i = 0;

    function type() {
      if (i < text.length) {
        document.getElementById("typewritereffect").textContent += text.charAt(i);
        i++;
        setTimeout(type, speed);
      }
    }

    type();
  </script>
</body>
</html>
