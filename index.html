<html><head>
  <title> ChickenSearch</title>
   <link rel="stylesheet" href="/styles.css">
</head>
<body>
<h1>ℂ𝕙𝕚𝕔𝕜𝕖𝕟𝕊𝕖𝕒𝕣𝕔𝕙</h1>
  <div id="typewriter"></div>

  <script>
    const text = "Browse the Web Safely and in Style with ChickenSearch";
    const speed = 100; 
    let i = 0;

    function type() {
      if (i < text.length) {
        document.getElementById("typewriter").textContent += text.charAt(i);
        i++;
        setTimeout(type, speed);
      }
    }

    type();
  </script>
</body>
</html>
